name: Unit tests

on:
  push:
    branches:
      - master
      - android-10
      - ghostty
  pull_request:
    branches:
      - master
      - android-10
      - ghostty

jobs:
  testing:
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.15.2
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_CMAKE_VERSION: 3.22.1
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Setup java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.15.2
    - name: Setup native build tools
      run: .github/scripts/setup-build-tools.sh
    - name: Execute tests
      run: |
        ./gradlew test
