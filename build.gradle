buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.2.2"
    }
}

def supportedAndroidAbis = ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
def requestedAndroidAbis = (System.getenv("TERMUX_ABIS") ?: project.properties.defaultAndroidAbis)
    .split(",").collect { it.trim() }.findAll { it }.unique()
if (requestedAndroidAbis.isEmpty()) {
    throw new GradleException("TERMUX_ABIS must list at least one Android ABI")
}
def unsupportedAndroidAbis = requestedAndroidAbis - supportedAndroidAbis
if (unsupportedAndroidAbis) {
    throw new GradleException("Unsupported Android ABIs in TERMUX_ABIS: " +
        unsupportedAndroidAbis.join(",") + ". Supported: " + supportedAndroidAbis.join(","))
}

ext {
    // Android ABIs shared by app, terminal-emulator and termux-shared native builds and APK packaging.
    requestedAbis = requestedAndroidAbis.asImmutable()
    nativeSourcesDir = new File(rootProject.projectDir, "build/native-sources")
    nativeSourceRevisions = [
        ghostty: [
            repository: "https://github.com/ghostty-org/ghostty.git",
            revision: "7ec9e26a29399b30ef78f06985fc75045b3cecb6"],
        freetype: [
            repository: "https://github.com/freetype/freetype.git",
            revision: "0a0221a1347e2f1e07c395263540026e9a0aa7c7"],
        harfbuzz: [
            repository: "https://github.com/harfbuzz/harfbuzz.git",
            revision: "36cb489cb02ce4b92099669ba9f9bea348eff93f"],
        libpng: [
            repository: "https://github.com/pnggroup/libpng.git",
            revision: "3061454d980de7d53608f594194cfac722721d2a"]]
}

tasks.register("prepareNativeSources", Exec) {
    workingDir rootProject.projectDir
    commandLine "bash", "scripts/prepare-native-sources.sh"
    environment "NATIVE_SOURCES_DIR", rootProject.ext.nativeSourcesDir.absolutePath
    inputs.file rootProject.file("scripts/prepare-native-sources.sh")
    rootProject.ext.nativeSourceRevisions.each { dependency, source ->
        environment "${dependency.toUpperCase()}_REPOSITORY", source.repository
        environment "${dependency.toUpperCase()}_REVISION", source.revision
        inputs.property "nativeSource.${dependency}.repository", source.repository
        inputs.property "nativeSource.${dependency}.revision", source.revision
        outputs.file new File(rootProject.ext.nativeSourcesDir,
            ".revisions/$dependency")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
