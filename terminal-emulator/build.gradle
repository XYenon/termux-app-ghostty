apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

def nativeSourcesDir = rootProject.ext.nativeSourcesDir
def libpngSrc = new File(nativeSourcesDir, "libpng")
def freetypeSrc = new File(nativeSourcesDir, "freetype")
def harfbuzzSrc = new File(nativeSourcesDir, "harfbuzz")
def requestedAbis = (System.getenv("TERMUX_ABIS") ?:
    project.properties.defaultAndroidAbis).split(",") as List
def ghosttyRoot = new File(project.buildDir, "ghostty").absolutePath

android {
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                arguments "-DGHOSTTY_ROOT=" + ghosttyRoot,
                    "-DLIBPNG_SRC=" + libpngSrc,
                    "-DFREETYPE_SRC=" + freetypeSrc,
                    "-DHARFBUZZ_SRC=" + harfbuzzSrc,
                    "-DANDROID_STL=c++_static"
            }
        }

        ndk {
            abiFilters(*requestedAbis)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version project.properties.cmakeVersion
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.register("buildGhosttyAndroid", Exec) {
    dependsOn rootProject.tasks.named("prepareNativeSources")
    workingDir rootProject.projectDir
    commandLine "bash", "scripts/build-ghostty-android.sh"
    environment "GHOSTTY_ANDROID_OUTPUT_ROOT", ghosttyRoot
    environment "TERMUX_ABIS", requestedAbis.join(",")
    environment "ZIG_VERSION", project.properties.zigVersion
    environment "ANDROID_NDK_VERSION", project.properties.ndkVersion
    environment "ANDROID_API_LEVEL", project.properties.minSdkVersion
    environment "GHOSTTY_REVISION",
        rootProject.ext.nativeSourceRevisions.ghostty.revision
    environment "FREETYPE_REVISION",
        rootProject.ext.nativeSourceRevisions.freetype.revision
    environment "HARFBUZZ_REVISION",
        rootProject.ext.nativeSourceRevisions.harfbuzz.revision
    environment "LIBPNG_REVISION",
        rootProject.ext.nativeSourceRevisions.libpng.revision
    environment "NATIVE_SOURCES_DIR", nativeSourcesDir.absolutePath
    inputs.files(
        rootProject.file("native/patches/ghostty-android.patch"),
        rootProject.file("scripts/build-ghostty-android.sh"),
        rootProject.file("scripts/verify-native-deps.sh"),
        new File(nativeSourcesDir, ".revisions/ghostty"))
    requestedAbis.each { abi ->
        outputs.file new File(ghosttyRoot, abi + "/lib/libghostty-vt.a")
        outputs.dir new File(ghosttyRoot, abi + "/include/ghostty")
    }
}

afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith("configureCMake") ||
            task.name.startsWith("buildCMake") ||
            task.name.startsWith("generateJsonModel")
    }.configureEach {
        dependsOn tasks.named("buildGhosttyAndroid")
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.3.0"
    testImplementation "junit:junit:4.13.2"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    classifier "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'com.termux'
                artifactId = 'terminal-emulator'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
